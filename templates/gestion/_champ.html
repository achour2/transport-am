<div class="{{ col }} mb-3">
  <label class="form-label fw-semibold small" for="{{ f.id_for_label }}">{{ f.label }}{% if f.field.required %} <span class="text-danger">*</span>{% endif %}</label>
  {{ f }}
  {% if f.help_text %}<div class="form-text">{{ f.help_text }}</div>{% endif %}
  {% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
</div>
