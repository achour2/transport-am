{% load static %}<link rel="stylesheet" href="{% static 'vendor/leaflet/leaflet.css' %}">
<script src="{% static 'vendor/leaflet/leaflet.js' %}"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  (window.cartes || []).forEach(function (c) {
    var el = document.getElementById(c.id);
    if (!el || typeof L === "undefined") return;
    var map = L.map(el, { scrollWheelZoom: false });
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18, attribution: "&copy; OpenStreetMap"
    }).addTo(map);
    var pts = [];
    var icone = function (couleur) {
      return L.divIcon({ className: "", html: '<div style="width:16px;height:16px;border-radius:50%;background:' + couleur + ';border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>', iconSize: [16, 16], iconAnchor: [8, 8] });
    };
    if (c.depart) { pts.push([c.depart[0], c.depart[1]]); L.marker([c.depart[0], c.depart[1]], { icon: icone("#1f4e79") }).addTo(map).bindPopup("Départ : " + c.depart[2]); }
    var trajet = c.depart ? [[c.depart[0], c.depart[1]]] : [];
    c.positions.forEach(function (p, i) {
      trajet.push([p[0], p[1]]); pts.push([p[0], p[1]]);
      var dernier = i === c.positions.length - 1;
      L.circleMarker([p[0], p[1]], { radius: dernier ? 9 : 5, color: "#fff", weight: 2, fillColor: dernier ? "#f28c28" : "#5b8fc4", fillOpacity: 1 })
        .addTo(map).bindPopup((p[2] || "Position") + "<br><small>" + p[3] + "</small>");
    });
    if (trajet.length > 1) L.polyline(trajet, { color: "#f28c28", weight: 4 }).addTo(map);
    if (c.arrivee) {
      pts.push([c.arrivee[0], c.arrivee[1]]);
      L.marker([c.arrivee[0], c.arrivee[1]], { icon: icone("#2e7d32") }).addTo(map).bindPopup("Arrivée : " + c.arrivee[2]);
      var der = trajet[trajet.length - 1];
      if (der) L.polyline([der, [c.arrivee[0], c.arrivee[1]]], { color: "#1f4e79", weight: 2, dashArray: "6 8" }).addTo(map);
    }
    if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 7 }); else map.setView([40, -20], 2);
  });
});
</script>
