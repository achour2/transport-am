# Déploiement Render (Blueprint) : New + → Blueprint → choisir ce dépôt
databases:
  - name: talaouglid-db
    plan: free
    databaseName: talaouglid
    user: talaouglid

services:
  - type: web
    name: talaouglid
    runtime: python
    plan: free
    region: virginia
    buildCommand: ./build.sh
    startCommand: ./start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: talaouglid-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: SERVE_MEDIA
        value: "true"
      - key: CHARGER_DEMO
        value: "true"
      - key: DJANGO_ADMIN_EMAIL
        sync: false
      - key: DJANGO_ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
