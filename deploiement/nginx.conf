# /etc/nginx/sites-available/transbagages — puis : certbot --nginx -d transbagages.example
server {
    listen 80;
    server_name transbagages.example www.transbagages.example;
    client_max_body_size 10M;

    location /static/ { alias /srv/transbagages/staticfiles/; expires 30d; }
    location /media/  { alias /srv/transbagages/media/; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
