# Lance les tests automatiques à chaque envoi et à chaque demande de fusion.
# Dans GitHub : Settings → Branches → règle sur « main » → « Require status checks to pass » → cocher « tests ».
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: talaouglid
          POSTGRES_PASSWORD: talaouglid
          POSTGRES_DB: talaouglid
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U talaouglid" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://talaouglid:talaouglid@localhost:5432/talaouglid
      DJANGO_SECRET_KEY: cle-de-test-uniquement-pour-github-actions-0123456789abcdef
      DJANGO_DEBUG: "false"
      DJANGO_SSL_REDIRECT: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check --deploy --fail-level ERROR
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test core
